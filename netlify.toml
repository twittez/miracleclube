[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/api/payments/pix"
  to = "/.netlify/functions/pix"
  status = 200

[[redirects]]
  from = "/api/payments/card-declined"
  to = "/.netlify/functions/card-declined"
  status = 200

[[redirects]]
  from = "/api/orders/:orderId/status"
  to = "/.netlify/functions/status?orderId=:orderId"
  status = 200

[[redirects]]
  from = "/api/webhooks/beehive"
  to = "/.netlify/functions/webhook"
  status = 200

# SPA Catch-All Redirect for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
