
<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; padding: 20px; }
  .viewport {
    width: 358px;
    height: 358px;
    background: #ffffff;
    border: 3px solid red;
    overflow: hidden;
    position: relative;
  }
  .img-contain {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .img-cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .img-native {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <h2 style="color:white">1. object-fit: contain (358x358)</h2>
  <div class="viewport">
    <img class="img-contain" src="file:///C:/Users/luanl/.gemini/antigravity/scratch/body-shapewear-lp/public/images/product/ref_01.png" />
  </div>

  <h2 style="color:white; margin-top:20px;">2. object-fit: cover (358x358)</h2>
  <div class="viewport">
    <img class="img-cover" src="file:///C:/Users/luanl/.gemini/antigravity/scratch/body-shapewear-lp/public/images/product/ref_01.png" />
  </div>

  <h2 style="color:white; margin-top:20px;">3. width: 100%, height: auto (358x358 viewport)</h2>
  <div class="viewport">
    <img class="img-native" src="file:///C:/Users/luanl/.gemini/antigravity/scratch/body-shapewear-lp/public/images/product/ref_01.png" />
  </div>
</body>
</html>
